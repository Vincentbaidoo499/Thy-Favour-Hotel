# Netlify configuration for Thy Favour Hotel (Vite + React SPA)
[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: serve index.html for all routes (deep links & refreshes never 404)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache hashed build assets (Vite emits fingerprinted files under /assets)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images: cache, but allow revalidation
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
